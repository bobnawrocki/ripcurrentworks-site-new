<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RipCurrent Works</title>
  <meta name="description" content="RipCurrent Works builds practical software for better decisions, movement, health, travel, and everyday life." />
  <style>
    :root {
      --bg: #0B0F14;
      --bg-navy: #0F2138;
      --text: #FFFFFF;
      --text-muted: #AAB4BE;
      --line: rgba(255,255,255,.10);
      --line-strong: rgba(255,255,255,.16);
      --panel: rgba(15, 33, 56, .62);
      --panel-2: rgba(255,255,255,.03);
      --accent: #2FD4FF;
      --accent-soft: rgba(47,212,255,.14);
      --secondary: #2E6F8E;
      --shadow: rgba(0,0,0,.34);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(47,212,255,.10), transparent 26%),
        radial-gradient(circle at 82% 30%, rgba(46,111,142,.18), transparent 30%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-navy) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .card {
      width: 100%;
      max-width: 920px;
      padding: 44px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(15,33,56,.72) 0%, rgba(11,15,20,.84) 100%);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 90px var(--shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 34px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .brand-logo {
      height: 56px;
      width: auto;
      display: block;
    }
    .brand-mark {
      display: none;
      width: 42px;
      height: 42px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--accent);
      opacity: .8;
    }
    h1 {
      font-size: clamp(40px, 6vw, 74px);
      line-height: .96;
      margin: 0 0 18px;
      letter-spacing: -.04em;
      max-width: 760px;
    }
    p {
      margin: 0;
      font-size: clamp(18px, 2.1vw, 22px);
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 720px;
    }
    .cta {
      margin-top: 34px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: transform .15s ease, opacity .15s ease, border-color .15s ease, background .15s ease;
    }
    .button:hover { transform: translateY(-1px); }
    .button-primary {
      background: linear-gradient(135deg, var(--accent), #67ddff);
      color: #07111d;
    }
    .button-secondary {
      border: 1px solid var(--line-strong);
      color: var(--text);
      background: var(--panel-2);
    }
    .button-secondary:hover {
      background: rgba(255,255,255,.05);
    }
    .footer {
      margin-top: 42px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    @media (max-width: 640px) {
      body { padding: 18px; }
      .card { padding: 26px 20px; border-radius: 18px; }
      .brand { margin-bottom: 26px; padding-bottom: 16px; }
      .brand-logo { display: none; }
      .brand-mark { display: block; }
      .footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img class="brand-logo" src="./logo-horizontal-light.png" alt="RipCurrent Works" />
      <img class="brand-mark" src="./symbol-light.png" alt="RipCurrent Works symbol" />
    </div>

    <div class="eyebrow">RipCurrent Works</div>
    <h1>Practical software for better decisions and everyday life.</h1>
    <p>
      RipCurrent Works builds practical software that helps people navigate everyday life a little better.
      More coming soon.
    </p>


    <div class="footer">
      <span>Built to be useful.</span>
      <span>© RipCurrent Works</span>
    </div>
  </main>
</body>
